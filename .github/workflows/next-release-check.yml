name: Next release checks

on:
  pull_request:
    paths:
      - 'apps/web-next/**'
      - 'testing/shopify/**'
      - '.dockerignore'
      - '.github/workflows/next-release-check.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('next-release-check-{0}', github.event.pull_request.number) || format('next-release-check-{0}-{1}-{2}', github.workflow, github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web-next/package-lock.json
      # Cache lookup can find a prefix match; restore only an exact hit.
      - name: Look up installed dependencies
        id: dependency-lookup
        uses: actions/cache/restore@v4
        with:
          path: apps/web-next/node_modules
          key: ${{ runner.os }}-node-24-web-next-modules-${{ hashFiles('apps/web-next/package-lock.json') }}
          lookup-only: true
      - name: Restore exact installed dependencies
        id: dependencies
        if: steps.dependency-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/web-next/node_modules
          key: ${{ runner.os }}-node-24-web-next-modules-${{ hashFiles('apps/web-next/package-lock.json') }}
      - name: Install locked dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: apps/web-next
        run: npm ci
      - name: Save exact installed dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/web-next/node_modules
          key: ${{ runner.os }}-node-24-web-next-modules-${{ hashFiles('apps/web-next/package-lock.json') }}
      - name: Dependency audit
        working-directory: apps/web-next
        run: npm audit --omit=dev --audit-level=moderate
      - name: Controlled Shopify harness contracts (local only)
        run: node --test testing/shopify/*.test.mjs
      - name: Controlled Shopify topology contract (render only)
        run: node testing/shopify/check-compose.mjs
      - name: Typecheck
        working-directory: apps/web-next
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web-next
        run: npm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web-next/package-lock.json
      # Cache lookup can find a prefix match; restore only an exact hit.
      - name: Look up installed dependencies
        id: dependency-lookup
        uses: actions/cache/restore@v4
        with:
          path: apps/web-next/node_modules
          key: ${{ runner.os }}-node-24-web-next-modules-${{ hashFiles('apps/web-next/package-lock.json') }}
          lookup-only: true
      - name: Restore exact installed dependencies
        id: dependencies
        if: steps.dependency-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/web-next/node_modules
          key: ${{ runner.os }}-node-24-web-next-modules-${{ hashFiles('apps/web-next/package-lock.json') }}
      - name: Install locked dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: apps/web-next
        run: npm ci
      - name: Save exact installed dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/web-next/node_modules
          key: ${{ runner.os }}-node-24-web-next-modules-${{ hashFiles('apps/web-next/package-lock.json') }}
      - name: Unit and route contracts
        working-directory: apps/web-next
        run: npm test -- --maxWorkers=2 --shard=${{ matrix.shard }}/3

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web-next/package-lock.json
      # Cache lookup can find a prefix match; restore only an exact hit.
      - name: Look up installed dependencies
        id: dependency-lookup
        uses: actions/cache/restore@v4
        with:
          path: apps/web-next/node_modules
          key: ${{ runner.os }}-node-24-web-next-modules-${{ hashFiles('apps/web-next/package-lock.json') }}
          lookup-only: true
      - name: Restore exact installed dependencies
        id: dependencies
        if: steps.dependency-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/web-next/node_modules
          key: ${{ runner.os }}-node-24-web-next-modules-${{ hashFiles('apps/web-next/package-lock.json') }}
      - name: Install locked dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: apps/web-next
        run: npm ci
      - name: Save exact installed dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/web-next/node_modules
          key: ${{ runner.os }}-node-24-web-next-modules-${{ hashFiles('apps/web-next/package-lock.json') }}
      - name: Real disposable PostgreSQL, REST and Storage integration (no external credentials)
        run: |
          python3 -m unittest discover -s testing/shopify/local -p 'test_*.py'
          node --test testing/shopify/local/*.test.mjs
          python3 testing/shopify/local/stack.py up
          python3 testing/shopify/local/stack.py test
          python3 testing/shopify/local/stack.py rehearse
          python3 testing/shopify/local/stack.py redis
          python3 testing/shopify/local/stack.py test-redis
          python3 testing/shopify/local/foundations.py
      - name: Stop only the disposable local database stack
        if: always()
        run: |
          if test -f ../work/grindctrl-m1-local/state.json; then
            python3 testing/shopify/local/stack.py stop
          fi

  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web-next/package-lock.json
      # Cache lookup can find a prefix match; restore only an exact hit.
      - name: Look up installed dependencies
        id: dependency-lookup
        uses: actions/cache/restore@v4
        with:
          path: apps/web-next/node_modules
          key: ${{ runner.os }}-node-24-web-next-modules-${{ hashFiles('apps/web-next/package-lock.json') }}
          lookup-only: true
      - name: Restore exact installed dependencies
        id: dependencies
        if: steps.dependency-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/web-next/node_modules
          key: ${{ runner.os }}-node-24-web-next-modules-${{ hashFiles('apps/web-next/package-lock.json') }}
      - name: Install locked dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: apps/web-next
        run: npm ci
      - name: Save exact installed dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/web-next/node_modules
          key: ${{ runner.os }}-node-24-web-next-modules-${{ hashFiles('apps/web-next/package-lock.json') }}
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate without production credentials or publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-next/Dockerfile
          load: true
          push: false
          tags: grindctrl-release-check:${{ github.sha }}
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=release-candidate
          cache-to: type=gha,scope=release-candidate,mode=max
      - name: Scan candidate OS and runtime libraries
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: grindctrl-release-check:${{ github.sha }}
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Start isolated candidate and verify its exact release
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          docker run --detach --name gc-release-candidate --memory=1g --cpus=2 -p 127.0.0.1:3101:3000 grindctrl-release-check:${{ github.sha }}
          ready=0
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3101/api/health | node -e 'let s="";process.stdin.on("data",b=>s+=b).on("end",()=>{try{const j=JSON.parse(s);process.exit(j.ok===true&&j.release===process.env.EXPECTED_RELEASE?0:1)}catch{process.exit(1)}})'; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:3101/icon.svg -o /dev/null
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:3101/widget/v1/messenger.js -o /dev/null
          # Credential-free startup/static checks are not authenticated UI QA.
          test "$(docker inspect --format '{{.Config.User}}' gc-release-candidate)" = node
      # Golden Landing Standard: responsive overflow, WCAG 2.2 AA (axe), RTL
      # icon mirroring, and visual regression on the marketing pages — see
      # docs/golden-landing-standard.md. Runs against this exact
      # already-built, already-running production candidate (not a second,
      # differently-built dev server), so results reflect what would ship
      # and visual-regression screenshots come from one consistent
      # Linux/Docker environment run to run. Node/npm and this app's own
      # dependencies (@playwright/test, @axe-core/playwright) are already
      # set up by the "Install locked dependencies" step above; only the
      # Playwright-managed browser binary is missing.
      - name: Install Playwright browsers
        working-directory: apps/web-next
        # Runner apt mirrors sometimes fail DNS. Retry, then fall back to the
        # browser alone: the hosted image already has its system libraries.
        run: |
          for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; echo "install attempt $i failed"; sleep 20; done
          npx playwright install chromium
      - name: Golden landing standard checks
        working-directory: apps/web-next
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3101
        run: npx playwright test golden-standard- mobile-overflow.spec.ts landing-translate-resilience.spec.ts
      # Fixtures are intentionally absent from the production candidate.
      # The same job runs their layout proof against Next dev, without secrets.
      - name: Shopper sheet scroll checks (dev fixtures)
        working-directory: apps/web-next
        run: npx playwright test sheet-scroll.spec.ts sheet-scroll-guards.spec.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-landing-standard-report
          path: apps/web-next/playwright-report/
          retention-days: 14
      - name: Remove only this job's disposable candidate
        if: always()
        run: docker rm --force gc-release-candidate || true

  verify:
    needs: [static, unit, integration, candidate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Require every check to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request'
      - name: Record verified tree
        if: github.event_name == 'pull_request'
        run: git rev-parse 'HEAD^{tree}' > verified-tree
      - name: Upload verified tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: verified-tree
          path: verified-tree
          if-no-files-found: error
          retention-days: 30
