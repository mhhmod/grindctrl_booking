name: Deploy Next VPS

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web-next/**"
      - ".github/workflows/deploy-next.yml"

# Only one deploy in flight at a time. Without this, two pushes close
# together each start their own SSH session on the VPS running the same
# deploy script concurrently, which was silently colliding with itself
# (and with manual deploys) for most of this project's life — queue,
# don't cancel, so a fast follow-up push still lands after the first.
concurrency:
  group: deploy-next-web
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ github.repository }}-web-next
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}-web-next' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Builds on a dedicated GitHub-hosted runner instead of the
      # production VPS, which was sharing 2 vCPUs with ~18 other live
      # containers — that contention, not the app, was why builds took
      # 20-60 minutes. GHA's own layer cache (cache-from/to: type=gha)
      # also means unchanged dependency/source layers are skipped on
      # repeat builds, not just cached npm packages.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-next/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # This key is restricted server-side (authorized_keys `command=`)
      # to only run /root/grindctrl-next/deploy-next.sh — it cannot run
      # arbitrary commands even if this secret ever leaked.
      - name: Pull the built image and restart the container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: /root/grindctrl-next/deploy-next.sh
