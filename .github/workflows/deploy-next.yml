name: Deploy Next VPS

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web-next/**"
      - ".github/workflows/deploy-next.yml"

# Only one deploy in flight at a time. Without this, two pushes close
# together each start their own SSH session on the VPS running the same
# deploy script concurrently, which was silently colliding with itself
# (and with manual deploys) for most of this project's life — queue,
# don't cancel, so a fast follow-up push still lands after the first.
concurrency:
  group: deploy-next-web
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ github.repository }}-web-next
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}-web-next' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Builds on a dedicated GitHub-hosted runner instead of the
      # production VPS, which was sharing 2 vCPUs with ~18 other live
      # containers — that contention, not the app, was why builds took
      # 20-60 minutes. GHA's own layer cache (cache-from/to: type=gha)
      # also means unchanged dependency/source layers are skipped on
      # repeat builds, not just cached npm packages.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-next/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # This key is restricted server-side (authorized_keys `command=`)
      # to only run /root/grindctrl-next/deploy-next.sh — it cannot run
      # arbitrary commands even if this secret ever leaked.
      #
      # command_timeout bounds the SSH command, not just auth — this step
      # is really "docker pull a several-hundred-MB image over this VPS's
      # bandwidth", which measured well over 5m on the first pull (the
      # image is currently one large ~628MB layer, so most deploys re-pull
      # most of it). 5m was sized for a fast git-pull-and-restart, a
      # premise that stopped holding once the deploy step started actually
      # transferring the image instead of just restarting a container.
      - name: Pull the built image and restart the container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: /root/grindctrl-next/deploy-next.sh

      # Added after a real incident: a Server Component throw in the root
      # layout (auth() called on a path middleware never runs for) took
      # down every /embed/* request and the merchant-facing try-on widget
      # with it, silently, for about a day before anyone noticed. This
      # would have caught it within a minute of that deploy instead.
      # First hits the container may still be restarting, so it retries
      # briefly before treating a failure as real; a route that's still
      # 5xx after that window is genuinely broken, not just slow to start.
      - name: Smoke check the live site
        run: |
          check() {
            local path="$1"
            local url="https://grindctrl.cloud${path}"
            local attempt
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo "000")
              if [ "$status" -lt 500 ]; then
                echo "OK   $status  $path"
                return 0
              fi
              echo "wait $status  $path (attempt $attempt/6)"
              sleep 5
            done
            echo "FAIL $status  $path"
            return 1
          }

          failed=0
          check "/" || failed=1
          check "/try-on" || failed=1
          check "/embed/try-on?shop=grindctrl.myshopify.com&product=short-tshirt" || failed=1
          check "/favicon.ico" || failed=1

          if [ "$failed" -ne 0 ]; then
            echo "One or more routes returned a 5xx after the restart window — deploy is live but broken."
            exit 1
          fi
