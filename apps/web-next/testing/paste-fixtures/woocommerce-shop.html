<!doctype html>
<!-- Imitates WooCommerce classic and block shop loops without ItemList or merchant card tags. -->
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="gc-fixture-path" content="/shop/">
  <meta name="gc-fixture-expect" content="cards:3">
  <title>WooCommerce shop</title>
  <script async src="http://localhost:3000/widget/v1/messenger.js" data-key="REPLACE_WITH_EMBED_KEY" data-gc-install="paste" data-gc-platform="website" data-gc-v="2"></script>
</head><body>
<script>window.wc_add_to_cart_params = {};</script>
<main>
  <ul class="products">
    <li class="product">
      <a class="woocommerce-LoopProduct-link" href="/product/linen-shirt/">
        <img src="https://store.example/wp-content/uploads/linen.jpg" width="600" height="800" alt="Linen shirt photo">
        <h2 class="woocommerce-loop-product__title">Linen shirt</h2>
      </a>
      <a class="add_to_cart_button" data-product_id="14" href="?add-to-cart=14">Add to cart</a>
    </li>
  </ul>
  <div class="wc-block-grid"><ul class="wc-block-grid__products">
    <li class="wc-block-grid__product">
      <a class="wc-block-grid__product-link" href="/product/silk-scarf/">
        <img src="https://store.example/wp-content/uploads/silk.jpg" width="600" height="800" alt="Silk scarf">
        <div class="wc-block-grid__product-title">Silk scarf</div>
      </a>
      <a class="add_to_cart_button" data-product_id="15" href="?add-to-cart=15">Add to cart</a>
    </li>
  </ul></div>
  <!-- Product Collection block (block themes): Add to cart is a button. -->
  <ul class="wc-block-product-template">
    <li class="wc-block-product post-16 product type-product has-post-thumbnail">
      <figure class="wc-block-components-product-image"><a href="/product/knit-polo/"><img src="https://store.example/wp-content/uploads/knit-polo.jpg" width="600" height="750" alt="Knit polo"></a></figure>
      <h3 class="wp-block-post-title"><a href="/product/knit-polo/">Knit polo</a></h3>
      <div class="wp-block-button wc-block-components-product-button"><button class="wp-block-button__link wp-element-button wc-block-components-product-button__button add_to_cart_button ajax_add_to_cart product_type_simple" data-product_id="16">Add to cart</button></div>
    </li>
  </ul>
</main>
</body></html>
