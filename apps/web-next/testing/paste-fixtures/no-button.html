<!doctype html>
<!-- Imitates: a catalogue-only site (orders by phone or DM): a JSON-LD
     Product, a gallery and a description, no purchase button and no <h1>
     (the name is a styled paragraph). The button floats at the bottom
     inline start. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="gc-fixture-path" content="/collection/sand-trench">
  <meta name="gc-fixture-expect" content="float">
  <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Product","name":"Sand trench coat","productID":"sand-trench",
     "image":"https://images.lookbook.example/sand-trench.jpg"}
  </script>
  <script async src="http://localhost:3000/widget/v1/messenger.js" data-key="REPLACE_WITH_EMBED_KEY" data-gc-install="paste" data-gc-platform="website" data-gc-v="2"></script>
</head>
<body>
  <div class="lookbook">
    <figure><img src="https://images.lookbook.example/sand-trench.jpg" width="1200" height="1600" alt=""></figure>
    <p class="title">Sand trench coat</p>
    <p>Water-repellent cotton gabardine. Message us on WhatsApp to order.</p>
  </div>
</body>
</html>
