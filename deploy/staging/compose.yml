name: grindctrl-staging

services:
  web:
    image: ${STAGING_IMAGE:?Use the staging deploy script to select an immutable image}
    container_name: grindctrl-staging-web
    env_file:
      - /root/grindctrl-staging/.env.staging
    environment:
      GRINDCTRL_ENV: staging
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    restart: unless-stopped
    init: true
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.75
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge, data]
    depends_on:
      redis:
        condition: service_healthy
      srh:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(async r=>{const j=await r.json();process.exit(r.ok&&j.ok===true&&j.release===process.env.SENTRY_RELEASE?0:1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      traefik.enable: "true"
      traefik.docker.network: grindctrl-staging-edge
      traefik.http.routers.grindctrl-staging.rule: Host(`shopify-m1-dev.grindctrl.cloud`)
      traefik.http.routers.grindctrl-staging.entrypoints: websecure
      traefik.http.routers.grindctrl-staging.tls: "true"
      traefik.http.routers.grindctrl-staging.tls.certresolver: mytlschallenge
      traefik.http.routers.grindctrl-staging.service: grindctrl-staging
      traefik.http.routers.grindctrl-staging.middlewares: grindctrl-staging-noindex
      traefik.http.services.grindctrl-staging.loadbalancer.server.port: "3000"
      traefik.http.middlewares.grindctrl-staging-noindex.headers.customresponseheaders.X-Robots-Tag: noindex, nofollow

  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    user: redis
    environment:
      REDIS_PASSWORD: ${STAGING_REDIS_PASSWORD:?Set the staging Redis password}
    # The generated config is private; the password is not a process argument.
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'requirepass %s\nappendonly yes\nappendfsync everysec\nmaxmemory 64mb\nmaxmemory-policy noeviction\n' "$$REDIS_PASSWORD" > /tmp/staging-redis.conf
        exec docker-entrypoint.sh redis-server /tmp/staging-redis.conf
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.15
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    networks: [data]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    environment:
      SRH_MODE: env
      SRH_PORT: "8080"
      SRH_MAX_CONNECTIONS: "2"
      SRH_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?Set the staging SRH token}
      SRH_CONNECTION_STRING: redis://:${STAGING_REDIS_PASSWORD:?Set the staging Redis password}@redis:6379
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.15
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:size=16m,mode=1777"
    networks: [data]
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

networks:
  edge:
    external: true
    name: grindctrl-staging-edge
  data:
    name: grindctrl-staging-data
    internal: true

volumes:
  redis-data:
    name: grindctrl-staging-redis-data
