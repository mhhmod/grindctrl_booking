 manual search steps and earlier access to prior notes. Handling time, retrieval latency, match reliability and any quality/cost effect must be measured during an authorized pilot; no percentage or cost saving is promised.", "ar": "القيمة المتوقعة: خطوات بحث يدوية أقل والوصول للملاحظات السابقة أسرع. وقت التعامل وسرعة ظهور البيانات وصحة المطابقة وأثر الجودة والتكلفة تُقاس في تجربة مصرح بها؛ بدون نسب أو توفير مضمون."}, {"en": "Proposed first collaboration. GRINDCTRL has no existing Concrete/Centro relationship or completed implementation. All contacts, masked phone numbers, tickets, notes, statuses and conversation examples are fictional. Screens are independent proposed workspace mock-ups, not official vendor screenshots.", "ar": "مقترح لأول تعاون. مفيش علاقة حالية أو تنفيذ سابق لـGRINDCTRL مع كونكريت أو Centro. كل العملاء والأرقام والتذاكر والملاحظات والحالات والمحادثات أمثلة خيالية. الشاشات واجهات مقترحة مستقلة، وليست لقطات رسمية للأنظمة."}, {"en": "Motion demonstrates event order, not measured system speed. This presentation has no live vendor connector, backend or AI model. Caller-number association suggests a contact; it is not authentication. Existing employee permissions and caller-verification procedures apply.", "ar": "الحركة توضح ترتيب الأحداث، وليست قياسًا لسرعة الأنظمة. العرض لا يشغّل ربطًا حيًا أو backend أو نموذج AI. الرقم يشير لسجل محتمل للعميل ولا يثبت هويته. تُطبّق صلاحيات الموظف وإجراءات التحقق من المتصل."}], "motion": {"steps": 4, "interval": 1250, "fade": 500}}, {"index": 2, "section": {"en": "02 · PROPOSED EXPERIENCE", "ar": "٠٢ · التجربة المقترحة"}, "title": {"en": "The call arrives. The context comes with it.", "ar": "المكالمة توصل. ومعلومات العميل تظهر معاها."}, "lead": {"en": "The caller’s number triggers the lookup in Zoho Desk.", "ar": "رقم المتصل يبدأ البحث تلقائيًا في Zoho Desk."}, "dark": false, "elements": [{"type": "image", "step": null, "key": "brand", "x": 60, "y": 29, "w": 43, "h": 32}, {"type": "text", "step": null, "x": 115, "y": ending.”", "ar": "«شايف التذكرة السابقة لحضرتك. مراجعة الفرع لسه مطلوبة.»"}, "size": 22, "color": "#54745c", "bold": false, "align": "start", "ltr": false, "role": "main"}], "mobile": [{"key": "genesys", "title": {"en": "Call arrives", "ar": "المكالمة توصل"}, "body": {"en": "Assigned to the employee", "ar": "وصلت للموظف"}, "step": 0}, {"key": "icon-call", "title": {"en": "Caller number is available", "ar": "رقم المتصل ظاهر"}, "body": {"en": "Used to find a candidate contact", "ar": "للبحث عن سجل محتمل للعميل"}, "step": 1}, {"key": "icon-search", "title": {"en": "Lookup starts automatically", "ar": "البحث يبدأ تلقائيًا"}, "body": {"en": "Search existing Desk records", "ar": "بحث في سجلات Desk الموجودة"}, "step": 2}, {"key": "zoho", "title": {"en": "Ticket history is found", "ar": "تم الوصول للتذاكر"}, "body": {"en": "T101 · Exchange follow-up", "ar": "T101 · متابعة استبدال"}, "step": 3}, {"key": "icon-file", "title": {"en": "Context appears", "ar": "معلومات العميل تظهر"}, "body": {"en": "Contact, ticket and latest note", "ar": "العميل والتذكرة وآخر ملاحظة"}, "step": 4}, {"key": "icon-actor", "title": {"en": "Continue with context", "ar": "نكمل بمعلومات أوضح"}, "body": {"en": "“The branch review is still pending.”", "ar": "«مراجعة الفرع لسه مطلوبة.»"}, "step": 5}], "notes": [{"en": "The user reports that Zoho is used for ticketing only, and that callers’ records/history do not pop up for employees in Genesys. The user also confirmed that manually searching the phone number finds the previous Zoho tickets. These are reported observations, not independently verified logs.", "ar": "المستخدم أفاد إن Zoho مستخدم للتذاكر فقط، وإن سجل العميل وتذاكره لا تظهر تلقائيًا للموظف مع مكالمة Genesys. وأكّد إن البحث اليدوي برقم التليفون بيوصل للتذاكر السابقة. دي معلومات من المستخدم ولم تُختبر داخل الأنظمة."}, {"en": "The initial offer is to inspect the existing contracted pop-up and make caller/ticket context appear at call assignment, using supported native configuration where suitable. No active Zoho CRM product is assumed.", "ar": "العرض الأول هو فحص الـpop-up المذكور في العقد وإظهار سياق العميل وتذاكره مع المكالمة، باستخدام إعدادات النظام الأصلية إذا كانت مناسبة. لا نفترض تشغيل منتج Zoho CRM."}, {"en": "The agent preview is an independent proposed workspace, not an official Genesys/Zoho screenshot. The implementation may use an existing URL pop-up or a supported embedded panel after assessing the actual desktop. It reads Desk contacts/tickets rather than assuming Zoho CRM.", "ar": "المعاينة واجهة مستقلة مقترحة وليست لقطة رسمية لـGenesys أو Zoho. التنفيذ ممكن يكون من خلال فتح رابط موجود أو لوحة داخلية مدعومة بعد فحص شاشة الموظف. القراءة من جهات الاتصال والتذاكر في Desk، بدون افتراض Zoho CRM."}, {"en": "The fictional workspace shows Contact A, two open tickets and one closed ticket. T101 is an exchange follow-up with branch review pending. The visible note is an existing-record illustration. Reading it does not close, reopen or change a ticket, verify caller identity or authorize a commercial decision.", "ar": "الواجهة الخيالية تعرض العميل A وتذكرتين مفتوحتين وواحدة مغلقة. T101 مثال لمتابعة استبدال بانتظار مراجعة الفرع. الملاحظة توضيح لسجل موجود؛ قراءتها لا تغلق أو تعيد فتح أو تغيّر تذكرة، ولا تتحقق من الهوية أو تصرّح بقرار تجاري."}, {"en": "Production design depends on the Genesys edition/desktop and its supported URL pop-up, event/SDK and caller-number availability, plus Zoho Desk permissions/API/search behavior. No unverified API endpoint or license entitlement is asserted. The UI fixture does not run a vendor connector or a backend.", "ar": "التصميم الفعلي يعتمد على إصدار Genesys وشاشة الموظف وطريقة الـpop-up أو الأحداث المدعومة وتوفر رقم المتصل، وعلى صلاحيات وبحث Zoho Desk. لا نفترض مسارات API أو صلاحيات تراخيص غير متحققة. المعاينة لا تشغّل ربطًا بالأنظمة أو backend."}, {"en": "Normalize equivalent phone forms under agreed numbering rules. A phone match is a candidate association, not authentication. Only the assigned employee’s permitted Desk records should be accessible. Record linking is explicit and should be idempotent for conversation/ticket in live implementation.", "ar": "توحيد صيغ أرقام التليفون يتم بقواعد متفق عليها. مطابقة الرقم تشير لسجل محتمل ولا تثبت الهوية. الموظف يرى فقط السجلات المصرح له بها. ربط السجلات يتم بشكل صريح، ويُمنع تكراره لنفس المكالمة والتذكرة في التنفيذ الفعلي."}, {"en": "This deck illustrates a successful lookup. Acceptance for the live implementation should also cover a shared number with multiple candidate contacts, an unknown or missing number, and unavailable Desk lookup. Multiple contacts need employee choice. Unknown numbers need manual phone/name/ticket search. An unavailable lookup must be distinguished from no tickets. Calls continue.", "ar": "العرض يوضح حالة بحث ناجحة. استلام التنفيذ الفعلي لازم يشمل الرقم المشترك بين أكثر من عميل، والرقم غير الموجود أو الناقص، وتعذر البحث في Desk. الموظف يختار بين السجلات المتعددة. الرقم غير الموجود يتيح البحث بالرقم أو الاسم أو مرجع التذكرة. تعذر البحث يختلف عن عدم وجود تذاكر. المكالمات تفضل مستمرة."}, {"en": "Follow Concrete’s caller-verification and employee record-access rules. These presentation mock-ups do not authenticate a caller or read or write real service records.", "ar": "تُطبّق إجراءات كونكريت للتحقق من المتصل وصلاحيات الموظف. الواجهات التوضيحية لا تثبت هوية المتصل ولا تقرأ أو تعدّل سجلات خدمة حقيقية."}, {"en": "Proposed first collaboration. GRINDCTRL has no existing Concrete/Centro relationship or completed implementation. All contacts, masked phone numbers, tickets, notes, statuses and conversation examples are fictional. Screens are independent proposed workspace mock-ups, not official vendor screenshots.", "ar": "مقترح لأول تعاون. مفيش علاقة حالية أو تنفيذ سابق لـGRINDCTRL مع كونكريت أو Centro. كل العملاء والأرقام والتذاكر والملاحظات والحالات والمحادثات أمثلة خيالية. الشاشات واجهات مقترحة مستقلة، وليست لقطات رسمية للأنظمة."}, {"en": "Motion demonstrates event order, not measured system speed. This presentation has no live vendor connector, backend or AI model. Caller-number association suggests a contact; it is not authentication. Existing employee permissions and caller-verification procedures apply.", "ar": "الحركة توضح ترتيب الأحداث، وليست قياسًا لسرعة الأنظمة. العرض لا يشغّل ربطًا حيًا أو backend أو نموذج AI. الرقم يشير لسجل محتمل للعميل ولا يثبت هويته. تُطبّق صلاحيات الموظف وإجراءات التحقق من المتصل."}], "motion": {"steps": 6, "interval": 1250, "fade": 500, "labels": [{"en": "Call arrives", "ar": "المكالمة توصل"}, {"en": "Caller number", "ar": "رقم المتصل"}, {"en": "Automatic lookup", "ar": "بحث تلقائي"}, {"en": "Ticket history found", "ar": "الوصول للتذاكر"}, {"en": "Employee sees context", "ar": "الموظف يشوف المعلومات"}, {"en": "Conversation continues", "ar": "المحادثة مستمرة"}]}}, {"index": 3, "section": {"en": "03 · HOW IT WORKS", "ar": "٠٣ · إزاي الربط يشتغل"}, "title": {"en": "Connect the call to the service history.", "ar": "نوصل المكالمة بتاريخ الخدمة."}, "lead": {"en": "Each system keeps its role. GRINDCTRL completes the workflow.", "ar": "كل نظام بيكمل دوره. وGRINDCTRL يكمّل الربط بينهم."}, "dark": false, "elements": [{"type": "image", "step": null, "key": "brand", "x": 60, "y": 29, "w": 43, "h": 32}, {"type": "text", "step": null, "x": 115, "y": 34, "w": 154, "h": 27, "text": {"en": "GRINDCTRL", "ar": "GRINDCTRL"}, "size": 17, "color": "#29302d", "bold": true, "align": "start", "ltr": true, "role": "navigation"}, {"type": "text", "step": null, "x": 782, "y": 35, "w": 438, "h": 26, "text": {"en": "03 · HOW IT WORKS", "ar": "٠٣ · إزاي الربط يشتغل"}, "size": 14, "color": "#68716b", "bold": false, "align": "end", "ltr": false, "role": "navigation"}, {"type": "text", "step": null, "x": 60, "y": 94, "w": 1160, "h": 64, "text": {"en": "Connect the call to the service history.", "ar": "نوصل المكالمة بتاريخ الخدمة."}, "size": 42, "color": "#29302d", "bold": true, "align": "start", "ltr": false, "role": "title"}, {"type": "text", "step": null, "x": 60, "y": 166, rted connection after checking the setup.", "ar": "نبدأ بالـpop-up المذكور في العقد، ونحدد طريقة الربط المدعومة بعد فحص الإعدادات."}, "size": 20, "color": "#68716b", "bold": false, "align": "start", "ltr": false, "role": "main"}], "mobile": [{"key": "genesys", "title": {"en": "Genesys", "ar": "Genesys"}, "body": {"en": "Caller number", "ar": "رقم المتصل"}, "step": 0}, {"key": "brand", "title": {"en": "GRINDCTRL", "ar": "GRINDCTRL"}, "body": {"en": "Connect the context", "ar": "ربط معلومات العميل"}, "step": 1}, {"key": "zoho", "title": {"en": "Zoho Desk", "ar": "Zoho Desk"}, "body": {"en": "Existing tickets", "ar": "التذاكر الموجودة"}, "step": 2}, {"key": "icon-actor", "title": {"en": "Employee view", "ar": "شاشة الموظف"}, "body": {"en": "History with the call", "ar": "التذاكر مع المكالمة"}, "step": 3}], "notes": [{"en": "Production design depends on the Genesys edition/desktop and its supported URL pop-up, event/SDK and caller-number availability, plus Zoho Desk permissions/API/search behavior. No unverified API endpoint or license entitlement is asserted. The UI fixture does not run a vendor connector or a backend.", "ar": "التصميم الفعلي يعتمد على إصدار Genesys وشاشة الموظف وطريقة الـpop-up أو الأحداث المدعومة وتوفر رقم المتصل، وعلى صلاحيات وبحث Zoho Desk. لا نفترض مسارات API أو صلاحيات تراخيص غير متحققة. المعاينة لا تشغّل ربطًا بالأنظمة أو backend."}, {"en": "Normalize equivalent phone forms under agreed numbering rules. A phone match is a candidate association, not authentication. Only the assigned employee’s permitted Desk records should be accessible. Record linking is explicit and should be idempotent for conversation/ticket in live implementation.", "ar": "توحيد صيغ أرقام التليفون يتم بقواعد متفق عليها. مطابقة الرقم تشير لسجل محتمل ولا تثبت الهوية. الموظف يرى فقط السجلات المصرح له بها. ربط السجلات يتم بشكل صريح، ويُمنع تكراره لنفس المكالمة والتذكرة في التنفيذ الفعلي."}, {"en": "The November 2023 contract, PDF page 4, explicitly lists “CRM URL pop up integration.” That proves it was in scope, not that it currently works, or that it includes two-way data synchronization. The reported symptom could arise from configuration, mapping, user access or another cause; inspect the actual setup before deciding whether to repair native configuration or build an adapter.", "ar": "عقد نوفمبر ٢٠٢٣ صفحة PDF ٤ يذكر نصًا “CRM URL pop up integration.” ده يثبت وجود البند في النطاق، ولا يثبت تشغيله حاليًا أو وجود مزامنة في الاتجاهين. السبب قد يكون إعدادات أو مطابقة أو صلاحيات أو غير ذلك؛ نفحص الوضع الفعلي قبل اختيار إصلاح الإعدادات الأصلية أو بناء وسيط."}, {"en": "Acceptance should cover real approved test calls, correct caller candidates and ticket visibility, duplicate/missing-number behavior, error fallback, permitted employee access and explicit nonduplicate call linking if included. Compare manual search actions/time with the delivered workflow and check actual lookup latency and match results. Agree thresholds and pilot scope with Concrete rather than inventing them.", "ar": "الاستلام يشمل مكالمات اختبار فعلية مصرح بها، ومطابقة السجلات وعرض التذاكر، والأرقام المشتركة أو الناقصة، وظهور الأخطاء، وصلاحيات الموظف، وربط المكالمة دون تكرار إذا كان ضمن النطاق. نقارن خطوات ووقت البحث اليدوي بالمسار الجديد ونقيس سرعة البحث ونتائجه. الحدود ونطاق التجربة تُحدد مع كونكريت بدون اختلاقها."}, {"en": "After context works, an optional AI summary can cite existing ticket notes and show missing/conflicting information for review. It must not invent actions, promises or case status. No live model, savings result or SaaS product validation exists yet.", "ar": "بعد ظهور السياق، ممكن إضافة ملخص AI مع مراجع للملاحظات وإظهار النواقص أو التعارض للمراجعة. لا يختلق إجراءات أو وعودًا أو حالات تذاكر. لا يوجد موديل حي أو نتائج توفير أو منتج SaaS متحقق منه بعد."}, {"en": "Proposed first collaboration. GRINDCTRL has no existing Concrete/Centro relationship or completed implementation. All contacts, masked phone numbers, tickets, notes, statuses and conversation exam  pop-up or a supported embedded panel after assessing the actual desktop. It reads Desk contacts/tickets rather than assuming Zoho CRM.", "ar": "المعاينة واجهة مستقلة مقترحة وليست لقطة رسمية لـGenesys أو Zoho. التنفيذ ممكن يكون من خلال فتح رابط موجود أو لوحة داخلية مدعومة بعد فحص شاشة الموظف. القراءة من جهات الاتصال والتذاكر في Desk، بدون افتراض Zoho CRM."}, {"en": "The fictional workspace shows Contact A, two open tickets and one closed ticket. T101 is an exchange follow-up with branch review pending. The visible note is an existing-record illustration. Reading it does not close, reopen or change a ticket, verify caller identity or authorize a commercial decision.", "ar": "الواجهة الخيالية تعرض العميل A وتذكرتين مفتوحتين وواحدة مغلقة. T101 مثال لمتابعة استبدال بانتظار مراجعة الفرع. الملاحظة توضيح لسجل موجود؛ قراءتها لا تغلق أو تعيد فتح أو تغيّر تذكرة، ولا تتحقق من الهوية أو تصرّح بقرار تجاري."}, {"en": "Proposed first collaboration. GRINDCTRL has no existing Concrete/Centro relationship or completed implementation. All contacts, masked phone numbers, tickets, notes, statuses and conversation examples are fictional. Screens are independent proposed workspace mock-ups, not official vendor screenshots.", "ar": "مقترح لأول تعاون. مفيش علاقة حالية أو تنفيذ سابق لـGRINDCTRL مع كونكريت أو Centro. كل العملاء والأرقام والتذاكر والملاحظات والحالات والمحادثات أمثلة خيالية. الشاشات واجهات مقترحة مستقلة، وليست لقطات رسمية للأنظمة."}, {"en": "Motion demonstrates event order, not measured system speed. This presentation has no live vendor connector, backend or AI model. Caller-number association suggests a contact; it is not authentication. Existing employee permissions and caller-verification procedures apply.", "ar": "الحركة توضح ترتيب الأحداث، وليست قياسًا لسرعة الأنظمة. العرض لا يشغّل ربطًا حيًا أو backend أو نموذج AI. الرقم يشير لسجل محتمل للعميل ولا يثبت هويته. تُطبّق صلاحيات الموظف وإجراءات التحقق من المتصل."}], "motion": {"steps": 4, "interval": 1250, "fade": 500}}, {"ind an agreed pilot.", "ar": "فوائد متوقعة · نقيس التغيير في تجربة نتفق عليها."}, "size": 18, "color": "#68716b", "bold": false, "align": "start", "ltr": false, "role": "main"}], "mobile": [{"key": "icon-clock", "title": {"en": "Less manual searching", "ar": "بحث يدوي أقل"}, "body": {"en": "Fewer steps before the informed response.", "ar": "خطوات أقل قبل الرد بمعلومات واضحة."}, "step": 0}, {"key": "icon-file", "title": {"en": "Faster case understanding", "ar": "فهم أسرع للحالة"}, "body": {"en": "The latest ticket note is already in view.", "ar": "آخر ملاحظة في التذكرة ظاهرة للموظف."}, "step": 1}, {"key": "icon-actor", "title": {"en": "Smoother follow-up", "ar": "متابعة أسهل"}, "body": {"en": "Continue from the existing service record.", "ar": "نكمل من سجل الخدمة الموجود."}, "step": 2}], "notes": [{"en": "The before sequence represents the user-reported missing automatic context and working manual phone search. The after sequence is a proposed experience with synthetic records. It does not claim that the current employee interface has been inspected.", "ar": "التسلسل الحالي يمثل غياب ظهور السياق تلقائيًا والبحث اليدوي الشغّال بحسب المستخدم. التسلسل المقترح يستخدم سجلات خيالية، وليس صورة لشاشة الموظف الحالية."}, {"en": "Expected value: fewer manual search steps and earlier access to prior notes. Handling time, retrieval latency, match reliability and any quality/cost effect must be measured during an authorized pilot; no percentage or cost saving is promised.", "ar": "القيمة المتوقعة: خطوات بحث يدوية أقل والوصول للملاحظات السابقة أسرع. وقت التعامل وسرعة ظهور البيانات وصحة المطابقة وأثر الجودة والتكلفة تُقاس في تجربة مصرح بها؛ بدون نسب أو توفير مضمون."}, {"en": "The November 2023 contract, PDF page 4, explicitly lists “CRM URL pop up integration.” That proves it was in scope, not that it currently works, or that it includes two-way data synchronization. The reported symptom could arise from configuration, mapping, user access or another cause; inspect the actual setup before deciding whether to repair native configuration or build an adapter.", "ar": "عقد نوفمبر ٢٠٢٣ صفحة PDF ٤ يذكر نصًا “CRM URL pop up integration.” ده يثبت وجود البند في النطاق، ولا يثبت تشغيله حاليًا أو وجود مزامنة في الاتجاهين. السبب قد يكون إعدادات أو مطابقة أو صلاحيات أو غير ذلك؛ نفحص الوضع الفعلي قبل اختيار إصلاح الإعدادات الأصلية أو بناء وسيط."}, {"en": "Acceptance should cover real approved test calls, correct caller candidates and ticket visibility, duplicate/missing-number behavior, error fallback, permitted employee access and explicit nonduplicate call linking if included. Compare manual search actions/time with the delivered workflow and check actual lookup latency and match results. Agree thresholds and pilot scope with Concrete rather than inventing them.", "ar": "الاستلام يشمل مكالمات اختبار فعلية مصرح بها، ومطابقة السجلات وعرض التذاكر، والأرقام المشتركة أو الناقصة، وظهور الأخطاء، وصلاحيات الموظف، وربط المكالمة دون تكرار إذا كان ضمن النطاق. نقارن خطوات ووقت البحث اليدوي بالمسار الجديد ونقيس سرعة البحث ونتائجه. الحدود ونطاق التجربة تُحدد مع كونكريت بدون اختلاقها."}, {"en": "After context works, an optional AI summary can cite existing ticket notes and show missing/conflicting information for review. It must not invent actions, promises or case status. No live model, savings result or SaaS product validation exists yet.", "ar": "بعد ظهور السياق، ممكن إضافة ملخص AI مع مراجع للملاحظات وإظهار النواقص أو التعارض للمراجعة. لا يختلق إجراءات أو وعودًا أو حالات تذاكر. لا يوجد موديل حي أو نتائج توفير أو منتج SaaS متحقق منه بعد."}, {"en": "Proposed first collaboration. GRINDCTRL has no existing Concrete/Centro relationship or completed implementation. All contacts, masked phone numbers, tickets, notes, statuses and conversation examples are fictional. Screens are independent proposed workspace mock-ups, not official vendor screenshots.", "ar": "مقترح لأول تعاون. مفيش علاقة حالية أو تنفيذ سابق لـGRINDCTRL مع كونكريت أو Centro. كل العملاء والأرقام والتذاكر والملاحظات والحالات والمحادثات أمثلة خيالية. الشاشات واجهات مقترحة مستقلة، وليست لقطات رسمية للأنظمة."}, {"en": "Motion demonstrates event order, not measured system speed. This presentation has no live vendor connector, backend or AI model. Caller-number association suggests a contact; it is not authentication. Existing employee permissions and caller-verification procedures apply.", "ar": "الحركة توضح ترتيب الأحداث، وليست قياسًا لسرعة الأنظمة. العرض لا يشغّل ربطًا حيًا أو backend أو نموذج AI. الرقم يشير لسجل محتمل للعميل ولا يثبت هويته. تُطبّق صلاحيات الموظف وإجراءات التحقق من المتصل."}], "motion": {"steps": 3, "interval": 1250, "fade": 500}}, {"index": 7, "section": {"en": "07 · OPTIONAL NEXT LAYER", "ar": "٠٧ · خطوة مستقبلية اختيارية"}, "title": {"en": "A foundation for future improvements.", "ar": "أساس لإضافات مستقبلية مفيدة."}, "lead": {"en": "Optional capabilities, scoped separately from the first delivery.", "ar": "إمكانيات اختيارية، نتفق على نطاقها بشكل منفصل عن التسليم الأول."}, "dark": false, "elements": [{"type": "image", "step": null, "key": "brand", "x": 60, "y": 29, "w": 43, "h": 32}, {"type": "text", "step": null, "x": 115, "y": 34, "w": 154, "h": 27, "text": {"en": "GRINDCTRL", "ar": "GRINDCTRL"}, "size": 17, "color": "#29302d", "bold": true, "align": "start", "ltr": true, "role": "navigation"}, {"type": "text", "step": null, "x": 782, "y": 35, "w": 438, "h": 26, "text": {"en": "07 · OPTIONAL NEXT LAYER", "ar": "٠٧ · خطوة مستقبلية اختيارية"}, "size": 14, "color": "#68716b", "bold": false, "align": "end", "ltr": false, "role": "navigation"}, {"type": "text", "step": null, "x": 60, "y": 94, "w": 1160, "h": 64, "text": {"en": "A foundation for future improvements.", "ar": "أساس لإضافات مستقبلية مفيدة."}, "size": 42, "color": "#29302d", "bold": true, "align": "start", "ltr": false, "role": "title"}, {"type": "text", "step": null, "x": 60, "y": 166, "w": 1160, "h": 38, "text": {"en": "Optional capabilities, scoped separately from the first delivery.", "ar": "إم ation procedures apply.", "ar": "الحركة توضح ترتيب الأحداث، وليست قياسًا لسرعة الأنظمة. العرض لا يشغّل ربطًا حيًا أو backend أو نموذج AI. الرقم يشير لسجل محتمل للعميل ولا يثبت هويته. تُطبّق صلاحيات الموظف وإجراءات التحقق من المتصل."}], "motion": {"steps": 3, "interval": 1250, "fade": 500}}], "sources": [{"file": "User report in this session", "pages": [], "supports": {"en": "Zoho used for ticketing; caller history does not pop up; manual phone search finds tickets. Not independently tested.", "ar": "Zoho للتذاكر؛ تاريخ العميل لا يظهر تلقائيًا؛ البحث اليدوي بالرقم يصل للتذاكر. لم يُختبر بصورة مستقلة."}}, {"file": "Concrete contract (29-11-2023).pdf", "pages": [4], "supports": {"en": "Exact scope line: “CRM URL pop up integration.” Not proof of current operation or two-way synchronization.", "ar": "بند النطاق بالنص: “CRM URL pop up integration.” ليس إثباتًا للتشغيل الحالي أو المزامنة في الاتجاهين."}}, {"file": "Concrete contract (06-09-2022).pdf", "pages": [7], "supports": {"en": "Zoho ticketing/integration scope. Not proof of an active Zoho CRM app or current field mapping.", "ar": "نطاق تذاكر وربط Zoho. لا يثبت تشغيل تطبيق Zoho CRM أو مطابقة الحقول الحالية."}}], "fixtures": {"notice": {"en": "Fictional records. Independent prototype; no live vendor connection.", "ar": "سجلات خيالية. نموذج مستقل بدون ربط حي بالأنظمة."}}},assets={"brand-white": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASAAAADACAYAAACksL62AAAQAElEQVR4nOydB5wb1fHH523RnSTTEwglVIMTSuhgwPRqmum9twChdwiYTiChhYT6JxQHHDqBECCYXgKhOTTHJEBMCaEYDMYnnbRl/r+RZGJ8K92qrHale9/P5yxZu6uy+97stDdjkEaj0cSEQRqNRhMTWgBpNJrY0AJIo9HEhhZAGo0mNrQA0mg0saEFkEajiQ0tgDQaTWxoAaTRaGJDCyCNRhMbWgBpNJrYsEij0TQMM89Fbn45TxlzEfkZ8lVGySOpDCn84UVi/ytm9RUbxpcW+1+TbX5FlJqmlPqUhjiKNBrNoEDQZD2vsJ5ifwU8H8GkllbEy2IKzUfNwPQB/n1VGepVVupl0+x5BoJpBg0RtADSaGYDAmaY6xZGGsQj2fdHYpaMbFrQ1PP5RM/jS0ywlHpIpTIvUBejBVAFDLofULE4r2v489fazyqr1HliK08pzhN5+MvkcNf6ijRdgVvM/QEPu1ECYOI34Ki92rAzt2CMfUNdxpAUQFzsW81VxjBc2LWY/aVxx1lFkVqRWgJ/Dnv/S5zZqYp5Gh6/hLr+paHUZ8z0 function shape(e){
 if(e.type==='line'){const x=locale==='ar'?1280-e.x:e.x,x2=locale==='ar'?1280-e.x2:e.x2;return `<line x1="${x}" y1="${e.y}" x2="${x2}" y2="${e.y2}" data-x2="${x2}" data-x1="${x}" data-y1="${e.y}" data-y2="${e.y2}" stroke="${e.color}" stroke-width="${e.width}" stroke-linecap="round" ${e.arrow?'marker-end="url(#arrow-'+current+'-'+e.color.slice(1)+')"':''}/>${e.arrow&&e.step!==null?`<circle class="signal" r="6" fill="${e.color}" cx="${x}" cy="${e.y}"/>`:''}`;}

 document.documentElement.lang=locale;document.documentElement.dir=locale==='ar'?'rtl':'ltr';document.title=t(story.title);
 document.querySelector('#header').innerHTML=`<span class="identity"><img src="${assets.brand}" alt=""><bdi>GRINDCTRL</bdi></span><span class="header-note">${t(W.motion)}</span><div class="tools"><button data-action="language">${t(W.language)}</button><button data-action="print">${t(W.print)}</button></div>`;
 document.querySelector('#deck').innerHTML=story.slides.map((s,i)=>`<article class="scene" ${i===current?'':'hidden'}><svg class="canvas" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(t(s.title))}"><defs>${[...new Set(s.elements.filter(e=>e.type==='line'&&e.arrow).map(e=>e.color))].map(c=>`<marker id="arrow-${i}-${c.slice(1)}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="${c}"/></marker>`).join('')}</defs><rect width="1280" height="720" fill="${s.dark?story.colors.ink:story.colors.bg}"/>${s.elements.map(e=>e.step===null?shape(e):`<g class="phase ${e.type==='line'?'wire':''}" data-step="${e.step}">${shape(e)}</g>`).join('')}</svg><div class="mobile ${s.dark?'dark':''}"><div class="section">${esc(t(s.section))}</div><h1>${esc(t(s.title))}</h1><p class="lead">${esc(t(s.lead))}</p>${s.mobile.map((m,j)=>`<div class="mobile-card phase" data-step="${m.step}"><img class="${['genesys','zoho'].includes(m.key)?'vendor':''} ${m.key==='zoho'&&s.dark?'zoho-on-dark':''}" src="${assets[m.key==='genesys'&&s.dark?'genesys-white':m.key]}" alt="${m.key.startsWith('icon-')?'':m.key}"><h2>${esc(t(m.title))}</h2><p>${esc(t(m.body))}</p></div>${j<s.mobile.length-1?`<div class="mobile-wire phase" data-step="${Math.min(m.step+1,s.motion.steps-1)}" aria-hidden="true">↓</div>`:''}`).join('')}</div></article>`).join('');
 // Marker IDs are slide-specific even when multiple slides are printed.
 document.querySelectorAll('.scene').forEach((s,i)=>s.querySelectorAll('line[marker-end]').forEach(l=>l.setAttribute('marker-end',`url(#arrow-${i}-${l.getAttribute('stroke').slice(1)})`)));
 document.querySelector('#footnote').textContent=t(W.foot);navigation();controls();setMotion(millis);
}
function navigation(){document.querySelector('#nav').innerHTML=`<button data-action="previous" ${current===0?'disabled':''}>${locale==='ar'?'→':'←'} ${t(W.previous)}</button><span class="slide-count"><bdi>${current+1} / ${story.slides.length}</bdi></span><button data-action="notes">${t(W.evidence)}</button><button class="primary" data-action="next" ${current===story.slides.length-1?'disabled':''}>${t(W.next)} ${locale==='ar'?'←':'→'}</button>`;}
function controls(){const ended=millis>=duration();document.querySelector('#controls').innerHTML=`<button class="primary" data-action="play">${icon(playing?'pause':ended?'replay':'play')}<span>${t(playing?W.pause:ended?W.replay:W.play)}</span></button><button data-action="replay">${icon('replay')}${t(W.replay)}</button><button data-action="step" ${ended?'disabled':''}>${icon('step')}${t(W.step)}</button><button data-action="all">${icon('all')}${t(W.all)}</button><span class="control-count" id="event-count"></span>`;}
function setMotion(value){
 millis=Math.max(0,Math.min(duration(),value));const m=story.slides[current].motion;
 document.querySelectorAll('.scene:not([hidden]) .phase').forEach(el=>{
  const p=Math.max(0,Math.min(1,(millis-Number(el.dataset.step)*m.interval)/m.fade)),shown=reduced?(p>0?1:0):p;
  el.style.opacity=shown;el.style.transform=el.classList.contains('wire')?'none':`translateY(${(1-shown)*5}px)`;el.setAttribute('aria-hidden',shown<1?'true':'false');
  if(el.classList.contains('wire')){const line=el.querySelector('line'),dot=el.querySelector('.signal');if(line){const x1=Number(line.dataset.x1),x2=Number(line.dataset.x2),y1=Number(line.dataset.y1),y2=Number(line.dataset.y2);line.setAttribute('x2',x1+(x2-x1)*shown);line.setAttribute('y2',y1+(y2-y1)*shown);if(dot){dot.setAttribute('cx',x1+(x2-x1)*shown);dot.setAttribute('cy',y1+(y2-y1)*shown);dot.style.opacity=shown>0&&shown<1?1:0;}}}
 });
 document.querySelector('#progress').style.width=(millis/duration()*100)+'%';
 const count=document.querySelector('#event-count'),event=Math.min(m.steps,Math.floor(millis/m.interval)+1);if(count)count.textContent=m.labels?`${event} / ${m.steps} · ${t(m.labels[event-1])}`:(locale==='ar'?'الحدث ':'Event ')+event+' / '+m.steps;
}
function pause(){playing=false;if(frame!==null)cancelAnimationFrame(frame);frame=null;last=null;controls();setMotion(millis);}
function tick(now){if(!playing)return;if(last!==null)setMotion(millis+now-last);last=now;if(millis>=duration()){pause();return;}frame=requestAnimationFrame(tick);}
function play(){if(playing){pause();return;}if(millis>=duration())setMotion(0);playing=true;last=null;controls();frame=requestAnimationFrame(tick);}
function replay(){pause();setMotion(0);play();}
function go(index){pause();current=Math.max(0,Math.min(story.slides.length-1,index));millis=0;render();if(reduced){setMotion(duration());controls();}else play();document.querySelector('#announce').textContent=t(story.slides[current].title);}
function setLocale(lang){const resume=playing;pause();locale=lang;render();if(resume)play();}
function showAll(){pause();setMotion(duration());controls();}
function notes(){pause();const d=document.querySelector('#dialog'),s=story.slides[current];d.innerHTML=`<div class="dialog-top"><h2 id="dialog-title">${t(W.evidence)}</h2><button data-action="close">${t(W.close)}</button></div>${s.notes.map(n=>`<p>${esc(t(n))}</p>`).join('')}${story.sources.map(x=>`<p class="source"><bdi>${esc(x.file)}${x.pages.length?' · '+x.pages.join(', '):''}</bdi><br>${esc(t(x.supports))}</p>`).join('')}`;d.showModal();}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;switch(b.dataset.action){case 'play':play();break;case 'replay':replay();break;case 'step':pause();setMotion(Math.min(duration(),(Math.floor(millis/story.slides[current].motion.interval)+1)*story.slides[current].motion.interval+story.slides[current].motion.fade));controls();break;case 'all':showAll();break;case 'next':go(current+1);break;case 'previous':go(current-1);break;case 'language':setLocale(locale==='en'?'ar':'en');break;case 'notes':notes();break;case 'close':document.querySelector('#dialog').close();break;case 'print':showAll();document.querySelectorAll('.scene .phase').forEach(x=>{x.style.opacity=1;x.style.transform='none';});document.querySelectorAll('line[data-x2]').forEach(x=>{x.setAttribute('x2',x.dataset.x2);x.setAttribute('y2',x.dataset.y2);});window.print();setMotion(millis);break;}});
document.addEventListener('keydown',event=>{if(document.querySelector('#dialog').open)return;if(event.key===(locale==='ar'?'ArrowLeft':'ArrowRight')){event.preventDefault();go(current+1);}else if(event.key===(locale==='ar'?'ArrowRight':'ArrowLeft')){event.preventDefault();go(current-1);}else if(event.code==='Space'&&!event.target.closest('button,input,select')){event.preventDefault();play();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
render();document.fonts.ready.then(()=>{if(reduced){showAll();}else play();});
</script></body></html>
