<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GRINDCTRL has moved</title>
<meta name="description" content="GRINDCTRL's site has moved to grindctrl.cloud."/>
<meta name="robots" content="noindex"/>
<link rel="canonical" href="https://grindctrl.cloud/"/>
<link rel="icon" type="image/svg+xml" href="logo-dark.svg"/>
<!-- Self-hosted fonts + shared design tokens (no external CDNs) -->
<link rel="stylesheet" href="fonts.css"/>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="base.css"/>
<style>
  .parked-shell {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: var(--gc-space-6, 24px);
    background: var(--gc-canvas, #101012);
    color: var(--gc-ink, #f4f4f5);
  }
  .parked-card {
    max-width: 34rem;
    width: 100%;
    background: var(--gc-surface-container-low, #1a1a1d);
    border: 1px solid color-mix(in srgb, currentColor 12%, transparent);
    border-radius: var(--gc-radius-lg, 16px);
    padding: clamp(24px, 6vw, 40px);
    text-align: start;
  }
  .parked-kicker {
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.7;
    margin: 0 0 12px;
  }
  .parked-title {
    font-size: clamp(1.4rem, 4vw, 1.9rem);
    line-height: 1.25;
    margin: 0 0 12px;
    font-weight: 600;
  }
  .parked-body {
    line-height: 1.65;
    margin: 0 0 20px;
    opacity: 0.85;
  }
  .parked-cta {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 999px;
    background: var(--gc-primary, #ff9a3d);
    color: #17130e;
    font-weight: 600;
    text-decoration: none;
  }
  .parked-cta:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
  }
  .parked-alt { margin-inline-start: 12px; opacity: 0.85; }
</style>
</head>
<body>
  <!-- This surface previously hosted the standalone "AI Support Widget"
       landing page and trial playground. The product now lives at
       grindctrl.cloud (Shopify virtual try-on + managed AI operations),
       so this page only redirects human visitors and points crawlers at
       the canonical domain. -->
  <main class="parked-shell">
    <section class="parked-card">
      <p class="parked-kicker">GRINDCTRL</p>
      <h1 class="parked-title" data-i18n="parked_title">We've moved to grindctrl.cloud</h1>
      <p class="parked-body" data-i18n="parked_body">
        This page is retired. Our virtual try-on for Shopify stores and managed AI
        operations now live on our main site.
      </p>
      <a class="parked-cta" href="https://grindctrl.cloud/">Open grindctrl.cloud</a>
      <span class="parked-alt" dir="rtl" lang="ar">أو زرنا بالعربية من الموقع الرئيسي.</span>
    </section>
  </main>
</body>
</html>
